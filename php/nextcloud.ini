; memory_limit, upload_max_filesize und post_max_size kommen aus
; PHP_MEMORY_LIMIT bzw. PHP_UPLOAD_LIMIT (.env), damit es nur eine Quelle gibt.
max_execution_time=3600
max_input_time=3600
output_buffering=0
opcache.enable=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=100000
opcache.revalidate_freq=60
apc.enable_cli=1
