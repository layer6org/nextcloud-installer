# Für cloudflared im lokalen Docker-/LAN-Netz. Direkten Zugriff auf den Origin
# durch die Host-Firewall beschränken, da dieser Header sonst fälschbar wäre.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;
