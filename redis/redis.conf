# Redis dient ausschließlich als Cache und für Transaktions-Locks von Nextcloud.
# Persistenz ist nicht nötig; volatile-lru verdrängt nur Schlüssel mit TTL,
# statt bei vollem Speicher alle Schreibzugriffe abzuweisen.
bind 0.0.0.0
protected-mode yes
port 6379
tcp-keepalive 300
timeout 0
appendonly no
save ""
maxmemory 512mb
maxmemory-policy volatile-lru
dir /data
